name: PR Hygiene

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  pr-title-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check PR title for Conventional Commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "PR Title: $PR_TITLE"
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|test|ci|refactor|perf|chore|revert|build)(\(.+\))?:\ .+ ]]; then
            echo "::error::❌ Your PR title does not follow the Conventional Commits format.
              This check ensures that all pull requests use clear, consistent titles that help automate changelogs and improve project history.

              Please update your PR title to follow the Conventional Commits style.
              Here is a link to a blog explaining the reason why we've included the Conventional Commits style into our PR titles: https://xfuture-blog.com/working-with-conventional-commits

              **Here are some examples of valid PR titles:**
              - feat: add user authentication
              - fix(login): handle null password error
              - docs(readme): update installation instructions"
            exit 1
          fi

  branch-name-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check branch name for an allowed prefix
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          echo "Branch: $BRANCH_NAME"
          if [[ ! "$BRANCH_NAME" =~ ^(feat|fix|docs|test|ci|refactor|perf|chore|revert|build)/.+ ]]; then
            echo "::error::❌ Your branch name does not start with an allowed prefix.
              Branches are named <prefix>/<description>, using the same prefixes the PR title check accepts, so a branch and the PR it opens describe the same kind of change.

              Allowed prefixes: feat, fix, docs, test, ci, refactor, perf, chore, revert, build

              **Here are some examples of valid branch names:**
              - feat/add-publications-section
              - fix/broken-render-on-empty-section
              - ci/add-release-workflow"
            exit 1
          fi
