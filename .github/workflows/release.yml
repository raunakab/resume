name: Release

on:
  push:
    branches: [main]
    paths:
      - main.yaml
      - pyproject.toml
      - uv.lock
      - .github/workflows/release.yml
  # Deliberately unfiltered: a required check that never runs leaves the PR
  # pending forever, so this must report on every PR, not just resume edits.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tags are needed to disambiguate same-day releases

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Pick a version tag
        id: version
        run: |
          base="$(date -u +%Y.%m.%d)"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="$base-$n"
          done
          # Both spellings of the same day, derived from one date call so they
          # cannot straddle a UTC midnight between steps.
          year="${base%%.*}"
          rest="${base#*.}"
          echo "tag=$tag" >>"$GITHUB_OUTPUT"
          echo "stamp=${rest%%.*}-${rest#*.}-$year" >>"$GITHUB_OUTPUT"

      - name: Render the resume under the release name
        id: render
        run: |
          path="rendercv_output/raunak-bhagat-${{ steps.version.outputs.stamp }}.pdf"
          uv run rendercv render main.yaml --pdf-path "$path"
          echo "path=$path" >>"$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        if: github.event_name != 'pull_request'
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: ${{ steps.render.outputs.path }}
